.marquee{overflow:hidden;overflow-y:hidden;width:100%;margin-top:22px;padding:8px 0 14px;position:relative;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 4%,#000 96%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,#000 4%,#000 96%,transparent 100%)}

.marquee:hover .marquee-track,.marquee:focus-within .marquee-track{animation-play-state:paused}
@keyframes marquee-scroll{
  0%{transform:translate3d(0,0,0)}
  100%{transform:translate3d(calc(-50% - 9px),0,0)}
}
.reel{flex:0 0 auto;width:clamp(210px,22vw,260px);aspect-ratio:9/13;border-radius:8px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font:inherit;color:inherit;background:linear-gradient(160deg,#f1e6cc,#e6d5b1 60%,#ddc79c);position:relative;isolation:isolate;overflow:hidden}

/* ===== mode logic ===== */

function reveal(){document.querySelectorAll("h2,.card:not(.reel),.chips li,.stats>div,.hero h1,.code,.show,.tl,.hero-portrait,.creative-avatar").forEach((el,i)=>{el.classList.add("rv");el.style.setProperty("--d",(i%5)*70+"ms");io?io.observe(el):el.classList.add("in")})}
let mode;
function pick(){let m=null;try{m=new URLSearchParams(location.search).get("mode")}catch(e){}
 if(!["creative","developer"].includes(m)){const h=location.hash.slice(1);m=["creative","developer"].includes(h)?h:null}
 if(!m){try{m=localStorage.getItem("ks-mode")}catch(e){}}
 return m=="creative"?"creative":"developer"}
function render(m,animate){
 const go=()=>{mode=m;document.documentElement.dataset.mode=m;document.title=TITLES[m];
  $("#main").innerHTML=VIEWS[m]();
  $("#nav").innerHTML=NAV[m].map(n=>`<a href="#${n[1]}" data-go="${n[1]}">${n[0]}</a>`).join("");
  document.querySelectorAll(".sw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m==m));
  $("#foot").innerHTML=`<div><b style="color:var(--tx)">Kanish Singh</b>${m=="creative"?" · Music Mania":""}<br>${esc(C.loc)} · © ${new Date().getFullYear()}</div><div><a href="mailto:${C.email}">${C.email}</a> · <a href="${waLink}" target="_blank" rel="noopener">${C.phoneShow}</a><br><a href="${C.ig}" target="_blank" rel="noopener">Instagram @music_mania440</a>${C.github?` · <a href="${C.github}" target="_blank" rel="noopener">GitHub</a>`:""}${C.linkedin?` · <a href="${C.linkedin}" target="_blank" rel="noopener">LinkedIn</a>`:""}</div>`;
  $("#main").classList.remove("out");window.scrollTo(0,0);reveal()};
 if(animate&&!matchMedia("(prefers-reduced-motion:reduce)").matches){$("#main").classList.add("out");setTimeout(go,250)}else go()}
function setMode(m){if(m==mode)return;try{localStorage.setItem("ks-mode",m)}catch(e){}
 try{history.replaceState(null,"","#"+m)}catch(e){location.hash=m}render(m,true)}
document.querySelectorAll(".sw button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#menu").onclick=e=>{const o=$("#nav").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o)};

/* ===== delegated clicks ===== */
document.addEventListener("click",e=>{

 if(g){e.preventDefault();$("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");const el=document.getElementById(g.dataset.go);el&&el.scrollIntoView({behavior:"smooth"})}
 const p=e.target.closest("#playreel");
 if(p){p.remove()}
 const r=e.target.closest("[data-reel]");
 if(r){const u=REELS[+r.dataset.reel].url,id=u.match(/reel\/([^/?]+)/)[1];
  $("#dbody").innerHTML=`<iframe loading="lazy" title="Project 0${+r.dataset.reel+1}" src="https://www.instagram.com/reel/${id}/embed" allowfullscreen></iframe><p class="note">If the preview stays blank, your browser blocked the embed. Use the button below.</p>`;
  $("#dlink").href=u;$("#dlg").showModal()}
 if(e.target.id=="dclose"){$("#dlg").close();$("#dbody").innerHTML=""}});
$("#dlg").addEventListener("close",()=>{$("#dbody").innerHTML=""});

render(pick(),false);
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["creative","developer"].includes(h)&&h!=mode)setMode(h)});
