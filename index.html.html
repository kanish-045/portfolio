<!DOCTYPE html>
<html lang="en" data-mode="developer">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kanish Singh – Java Backend & Full Stack Developer</title>
  <meta name="description" content="Kanish Singh: Java backend & full stack developer, and freelance video editor behind Music Mania based in Bhopal, India." />
  <meta property="og:title" content="Kanish Singh – Developer & Creative Portfolio" />
  <meta property="og:description" content="Backend engineering and cinematic video editing, in one dual-mode portfolio." />

  <!-- Typography: Unbounded (Expressive Headings), Manrope (Body & UI), JetBrains Mono (Code/Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- GSAP & ScrollTrigger for Cinematic Horizontal Gallery & Scroll Choreography -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & THEME VARIABLES (DEVELOPER = CULLET OBSIDIAN, CREATIVE = WARM CINEMA)
       ========================================================================== */
    :root {
      --bg: #f3ecdd;
      --surf: #faf5ea;
      --surf-2: #f1e6cc;
      --line: #d9ccb0;
      --line-strong: #c4b28d;
      --tx: #2b2418;
      --mut: #665a45;
      --a: #8f4f22;
      --b: #b8793a;
      --disp: 'Unbounded', Georgia, serif;
      --body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --r: 0px;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-mode="creative"] {
      --disp: 'Hecat Display Regular', 'Hecat Display', 'Syne', 'Unbounded', sans-serif;
    }

    html[data-mode="creative"] h1,
    html[data-mode="creative"] h2,
    html[data-mode="creative"] h3 {
      font-family: var(--disp);
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    html[data-mode="developer"] {
      --bg: #030604;
      --surf: #070d09;
      --surf-2: #0b150e;
      --line: rgba(34, 197, 94, 0.22);
      --line-strong: rgba(34, 197, 94, 0.4);
      --tx: #ecfdf5;
      --mut: #8fa697;
      --a: #22c55e;
      --b: #16a34a;
      --body: 'ReengokRegular', 'Reengok', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --r: 0px;
    }

    html {
      scroll-padding-top: calc(78px + env(safe-area-inset-top, 0px));
      scroll-behavior: smooth;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--tx);
      font-family: var(--body);
      font-size: 16.5px;
      line-height: 1.68;
      transition: background-color 0.45s ease, color 0.45s ease;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    html[data-mode="developer"] body {
      background-image:
        radial-gradient(ellipse 80% 45% at 50% -10%, rgba(34, 197, 94, 0.15), transparent 70%),
        linear-gradient(rgba(34, 197, 94, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 64px 64px, 64px 64px;
      background-attachment: fixed;
    }

    /* ==========================================================================
       CUSTOM CINEMA RETICLE CURSOR (CREATIVE MODE EXCLUSIVE - CLEAN & MINIMAL)
       ========================================================================== */
    @media (hover: hover) and (pointer: fine) {
      html[data-mode="creative"],
      html[data-mode="creative"] body,
      html[data-mode="creative"] a,
      html[data-mode="creative"] button,
      html[data-mode="creative"] [role="button"],
      html[data-mode="creative"] summary {
        cursor: none !important;
      }
    }

    .cinema-cursor-dot,
    .cinema-cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s ease;
      will-change: transform;
    }

    html[data-mode="creative"] .cinema-cursor-dot.visible,
    html[data-mode="creative"] .cinema-cursor-ring.visible {
      opacity: 1;
    }

    .cinema-cursor-dot {
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: var(--a);
    }

    .cinema-cursor-ring {
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--a) 70%, var(--tx));
      background: transparent;
      display: grid;
      place-items: center;
      transition:
        opacity 0.2s ease,
        width 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        margin 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.18s ease,
        border-color 0.18s ease;
    }

    .cinema-cursor-ring::before,
    .cinema-cursor-ring::after {
      display: none;
    }

    .cinema-cursor-label {
      font-family: var(--mono);
      font-size: 6px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .cinema-cursor-ring.is-hover {
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-color: var(--a);
      background: color-mix(in srgb, var(--a) 10%, transparent);
    }

    .cinema-cursor-ring.is-media {
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-color: transparent;
      background: linear-gradient(125deg, var(--a), var(--b));
      box-shadow: 0 3px 10px -2px color-mix(in srgb, var(--a) 55%, transparent);
    }

    .cinema-cursor-ring.is-media .cinema-cursor-label {
      opacity: 1;
      transform: scale(1);
    }

    .cinema-cursor-ring.is-down {
      transform-origin: center;
      border-width: 1.5px;
    }

    @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
      .cinema-cursor-dot,
      .cinema-cursor-ring {
        display: none !important;
      }
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--a);
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 12px;
      z-index: 100;
      padding: 10px 18px;
      border-radius: 99px;
      background: var(--a);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    .skip-link:focus {
      left: 16px;
    }

    /* ==========================================================================
       2. STICKY HEADER & NEUTRAL SINGLE-COLOR MODE SWITCHER
       ========================================================================== */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .bar {
      max-width: 1220px;
      margin: auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--disp);
      font-weight: 700;
      font-size: 16.5px;
      letter-spacing: -0.02em;
      text-decoration: none;
      white-space: nowrap;
      transition: letter-spacing 0.3s ease;
    }

    .brand:hover {
      letter-spacing: 0.02em;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--a);
      box-shadow: 0 0 12px var(--a);
    }

    nav {
      display: flex;
      gap: 4px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    nav a {
      padding: 6px 11px;
      border-radius: 99px;
      text-decoration: none;
      color: var(--mut);
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.25s ease, background 0.25s ease;
    }

    nav a:hover {
      color: var(--tx);
      background: color-mix(in srgb, var(--a) 12%, transparent);
    }

    /* Neutral single-color toggle pill */
    .sw {
      display: flex;
      position: relative;
      border: 1px solid var(--line-strong);
      border-radius: 99px;
      padding: 3px;
      background: var(--surf);
    }

    .sw button {
      position: relative;
      z-index: 1;
      background: none;
      border: 0;
      color: var(--mut);
      font-family: var(--body);
      font-weight: 600;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 99px;
      cursor: pointer;
      min-height: 38px;
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    .sw button:hover {
      color: var(--tx);
    }

    .sw button[aria-pressed="true"] {
      color: var(--bg);
    }

    .sw button[aria-pressed="true"]:hover {
      color: var(--bg);
    }

    .sw i {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      border-radius: 99px;
      background: var(--tx);
      transition: transform 0.4s cubic-bezier(0.6, 0.1, 0.2, 1), background 0.4s ease;
    }

    html[data-mode="creative"] .sw i {
      transform: translateX(100%);
    }

    .menu {
      display: none;
      background: var(--surf);
      border: 1px solid var(--line-strong);
      color: var(--tx);
      border-radius: 10px;
      padding: 8px 14px;
      font-family: var(--body);
      font-weight: 600;
      font-size: 14px;
      min-height: 40px;
      cursor: pointer;
    }

    /* ==========================================================================
       3. LAYOUT, TYPOGRAPHY & SHARED COMPONENTS
       ========================================================================== */
    main {
      transition: opacity 0.24s ease;
    }

    main.out {
      opacity: 0;
    }

    .container {
      max-width: 1220px;
      margin: auto;
      padding: 0 24px;
    }

    section {
      padding: 88px 0 24px;
    }

    h1, h2, h3 {
      font-family: var(--disp);
      line-height: 1.12;
      margin: 0 0 0.55em;
      color: var(--tx);
    }

    h1 {
      font-size: clamp(2.15rem, 5.2vw, 4.35rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      max-width: 16ch;
    }

    h2 {
      font-size: clamp(1.65rem, 3.4vw, 2.55rem);
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    h3 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    p {
      max-width: 64ch;
      color: var(--mut);
      margin-top: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--a);
      margin-bottom: 14px;
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--a);
      box-shadow: 0 0 8px var(--a);
    }

    .mono {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--a);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 22px;
      border-radius: 99px;
      border: 1px solid var(--line-strong);
      text-decoration: none;
      font-family: var(--body);
      font-weight: 600;
      font-size: 14.5px;
      background: color-mix(in srgb, var(--surf) 75%, transparent);
      color: var(--tx);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    html[data-mode="developer"] .btn {
      border-radius: var(--r);
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--a);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.p {
      background: linear-gradient(125deg, var(--a), var(--b));
      border: 0;
      color: #ffffff;
      box-shadow: 0 12px 28px -10px color-mix(in srgb, var(--a) 75%, transparent);
    }

    .btn.p::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.3), transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.6s ease;
    }

    .btn.p:hover::before {
      transform: translateX(120%);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0;
      list-style: none;
      margin: 14px 0;
    }

    .chips li {
      border: 1px solid var(--line-strong);
      border-radius: 99px;
      padding: 5px 13px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--mut);
      background: var(--surf);
      transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    html[data-mode="developer"] .chips li {
      border-radius: 0px;
      font-family: var(--mono);
      font-size: 12px;
      background: var(--surf-2);
    }

    .chips li:hover {
      transform: translateY(-2px);
      border-color: var(--a);
      color: var(--tx);
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
    }

    .card {
      background: var(--surf);
      border: 1px solid var(--line);
      border-radius: 0px !important;
      padding: 26px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.28s ease, transform 0.28s ease, box-shadow 0.28s ease;
    }

    html[data-mode="developer"] .card {
      transform-style: preserve-3d;
      will-change: transform;
      transition: border-color 0.28s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
    }

    html[data-mode="developer"] .card.is-tilting {
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    html[data-mode="developer"] .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        340px circle at var(--mx, 50%) var(--my, 50%),
        color-mix(in srgb, var(--a) 11%, transparent),
        transparent 70%
      );
      transition: opacity 0.28s ease;
      z-index: 0;
    }

    html[data-mode="developer"] .card.is-tilting::before {
      opacity: 1;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 2.5px;
      width: 100%;
      background: linear-gradient(90deg, var(--a), var(--b));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover {
      border-color: color-mix(in srgb, var(--a) 65%, var(--line));
      transform: translateY(-5px);
      box-shadow: 0 20px 38px -20px color-mix(in srgb, var(--a) 45%, transparent);
    }

    html[data-mode="developer"] .card:hover {
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-5px) scale3d(1.012, 1.012, 1.012);
    }

    .card:hover {
      border-color: color-mix(in srgb, var(--a) 65%, var(--line));
      transform: translateY(-5px);
      box-shadow: 0 20px 38px -20px color-mix(in srgb, var(--a) 45%, transparent);
    }

    .card:hover::after {
      transform: scaleX(1);
    }

    .card ul {
      padding-left: 18px;
      color: var(--mut);
      margin: 0.7em 0 0;
    }

    .card li + li {
      margin-top: 6px;
    }

    /* ==========================================================================
       4. DEVELOPER HERO + EXCLUSIVE INTERACTIVE TUBES BACKGROUND
       ========================================================================== */
    .dev-hero-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: radial-gradient(circle at 76% 34%, rgba(34, 197, 94, 0.14), transparent 55%), #030604;
    }

    #tubes-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    .dev-hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(3, 6, 4, 0.95) 0%, rgba(3, 6, 4, 0.7) 55%, rgba(3, 6, 4, 0.28) 100%),
        linear-gradient(to top, #030604 0%, transparent 24%);
    }

    .dev-hero-inner {
      position: relative;
      z-index: 2;
      max-width: 1220px;
      margin: auto;
      padding: 68px 24px 76px;
    }

    .hero-split {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 36px;
    }

    .hero-copy {
      flex: 1 1 600px;
      min-width: 0;
    }

    .hero-portrait-wrap {
      flex: 0 1 390px;
      max-width: 390px;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      margin-top: -34px;
    }

    .hero-portrait-glow {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.26), transparent 70%);
      filter: blur(28px);
      z-index: 0;
    }

    .hero-portrait {
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto;
      max-height: 490px;
      object-fit: contain;
      object-position: center top;
      filter: drop-shadow(0 20px 34px rgba(0, 0, 0, 0.65));
      -webkit-mask-image: linear-gradient(to bottom, #000 78%, rgba(0, 0, 0, 0.65) 92%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 78%, rgba(0, 0, 0, 0.65) 92%, transparent 100%);
    }

    .hero-portrait-fallback {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 4/5;
      border-radius: 0px;
      border: 1px solid var(--line-strong);
      background: linear-gradient(160deg, #09110b, #0e1911);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 44px -16px rgba(0, 0, 0, 0.75);
    }

    .code {
      background: rgba(9, 17, 11, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line-strong);
      border-radius: 0px;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.75;
      color: var(--mut);
      margin-top: 24px;
      max-width: 540px;
      overflow-x: auto;
      box-shadow: 0 14px 32px -18px rgba(0, 0, 0, 0.8);
    }

    .code .k {
      color: #4ade80;
    }

    .code .s {
      color: #86efac;
    }

    .code .c {
      color: #5c7364;
    }

    .code::after {
      content: "";
      display: inline-block;
      width: 8px;
      height: 14px;
      margin-left: 4px;
      background: var(--a);
      vertical-align: -2px;
      animation: blink 1.1s steps(2) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .tubes-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 7px 14px;
      border-radius: 99px;
      border: 1px solid var(--line-strong);
      background: rgba(12, 18, 14, 0.88);
      color: var(--mut);
      font-family: var(--mono);
      font-size: 11.5px;
      cursor: pointer;
      box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.65);
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .tubes-badge:hover {
      border-color: var(--a);
      color: var(--tx);
    }

    .tubes-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--a);
      box-shadow: 0 0 10px var(--a);
    }

    /* ==========================================================================
       5. DEVELOPER SCROLL-SYNCHRONIZED SVG JOURNEY & SECTIONS
       ========================================================================== */
    .dev-journey-shell {
      max-width: 1220px;
      margin: auto;
      padding: 0 24px 36px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 28px;
      position: relative;
    }

    .journey-rail {
      position: relative;
      padding-top: 88px;
    }

    .journey-svg {
      width: 56px;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .journey-track-bg {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .journey-track-fill {
      fill: none;
      stroke: url(#cullet-journey-grad);
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.65));
    }

    .journey-node {
      fill: #0c120e;
      stroke: var(--line-strong);
      stroke-width: 2;

    /* ==========================================================================
       3. INTERACTIVE 3D NEON TUBES BACKGROUND (DEVELOPER HERO EXCLUSIVE)
       ========================================================================== */
    class HeroTubesController {
      constructor(canvas, container, badgeBtn) {
        this.canvas = canvas;
        this.container = container;
        this.badgeBtn = badgeBtn;
        this.ctx = canvas ? canvas.getContext("2d") : null;
        this.rafId = null;
        this.width = 0;
        this.height = 0;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // Restrained emerald & matrix green palettes for black Developer Hero
        this.palettes = [
          {
            name: "Emerald Matrix",
            colors: ["#22c55e", "#4ade80", "#16a34a", "#10b981", "#86efac"]
          },
          {
            name: "Cyber Mint",
            colors: ["#10b981", "#34d399", "#059669", "#22c55e", "#6ee7b7"]
          },
          {
            name: "Neon Viridian",
            colors: ["#4ade80", "#15803d", "#22c55e", "#14532d", "#86efac"]
          }
        ];
        this.paletteIndex = 0;

        this.pointer = { x: 0.65, y: 0.42, tx: 0.65, ty: 0.42, active: false };
        this.tubes = [];
        this.time = 0;

        this.onResize = this.resize.bind(this);
        this.onPointerMove = this.handlePointerMove.bind(this);
        this.onPointerLeave = this.handlePointerLeave.bind(this);
        this.onHeroClick = this.handleHeroClick.bind(this);

        if (this.canvas && this.ctx && this.container) {
          this.initTubes();
          this.resize();
          this.bindEvents();
          if (this.reducedMotion) {
            this.renderFrame(0);
          } else {
            this.loop();
          }
        }
      }

      initTubes() {
        const count = window.innerWidth < 768 ? 4 : 6;
        const nodesPerTube = window.innerWidth < 768 ? 14 : 20;
        const palette = this.palettes[this.paletteIndex].colors;

        this.tubes = Array.from({ length: count }, (_, idx) => {
          const angle = (idx / count) * Math.PI * 2;
          const radius = 0.08 + (idx % 3) * 0.035;
          return {
            phase: angle,
            speed: 0.45 + (idx % 4) * 0.12,
            orbitRadius: radius,
            stiffness: 0.075 + (idx % 3) * 0.02,
            damping: 0.84,
            thickness: 1.5 + (idx % 3) * 0.6,
            color: palette[idx % palette.length],
            nodes: Array.from({ length: nodesPerTube }, () => ({
              x: 0.65,
              y: 0.42,
              vx: 0,
              vy: 0
            }))
          };
        });
      }

      resize() {
        if (!this.canvas || !this.container) return;
        const rect = this.container.getBoundingClientRect();
        this.width = Math.max(1, rect.width);
        this.height = Math.max(1, rect.height);
        this.canvas.width = Math.floor(this.width * this.dpr);
        this.canvas.height = Math.floor(this.height * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      bindEvents() {
        window.addEventListener("resize", this.onResize, { passive: true });
        this.container.addEventListener("pointermove", this.onPointerMove, { passive: true });
        this.container.addEventListener("pointerleave", this.onPointerLeave, { passive: true });
        this.container.addEventListener("click", this.onHeroClick);
      }

      handlePointerMove(e) {
        const rect = this.container.getBoundingClientRect();
        this.pointer.tx = (e.clientX - rect.left) / Math.max(1, rect.width);
        this.pointer.ty = (e.clientY - rect.top) / Math.max(1, rect.height);
        this.pointer.active = true;
      }

      handlePointerLeave() {
        this.pointer.active = false;
      }

      handleHeroClick(e) {
        if (e && e.target && e.target.closest("a, button") && !e.target.closest("#tubes-cycle-btn")) {
          return;
        }
        this.paletteIndex = (this.paletteIndex + 1) % this.palettes.length;
        const nextPalette = this.palettes[this.paletteIndex];
        this.tubes.forEach((tube, idx) => {
          tube.color = nextPalette.colors[idx % nextPalette.colors.length];
        });
        if (this.badgeBtn) {
          const swatch = this.badgeBtn.querySelector(".tubes-swatch");
          const label = this.badgeBtn.querySelector(".tubes-label");
          if (swatch) {
            swatch.style.background = nextPalette.colors[0];
            swatch.style.boxShadow = `0 0 10px ${nextPalette.colors[0]}`;
          }
          if (label) {
            label.textContent = `Tubes: ${nextPalette.name} · Click hero to shift`;
          }
        }
        if (this.reducedMotion) {
          this.renderFrame(0);
        }
      }

      loop() {
        this.time += 0.016;
        this.renderFrame(this.time);
        this.rafId = requestAnimationFrame(() => this.loop());
      }

      renderFrame(t) {
        const ctx = this.ctx;
        if (!ctx) return;

        ctx.clearRect(0, 0, this.width, this.height);

        // Idle gentle orbital target when cursor is outside hero
        if (!this.pointer.active) {
          this.pointer.tx = 0.68 + Math.cos(t * 0.55) * 0.11;
          this.pointer.ty = 0.44 + Math.sin(t * 0.72) * 0.09;
        }

        this.pointer.x += (this.pointer.tx - this.pointer.x) * 0.09;
        this.pointer.y += (this.pointer.ty - this.pointer.y) * 0.09;

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        for (let i = 0; i < this.tubes.length; i++) {
          const tube = this.tubes[i];
          const orbitAngle = t * tube.speed + tube.phase;
          const headTargetX =
            this.pointer.x * this.width + Math.cos(orbitAngle) * (this.width * tube.orbitRadius * 0.45);
          const headTargetY =
            this.pointer.y * this.height + Math.sin(orbitAngle * 1.25) * (this.height * tube.orbitRadius * 0.45);

          const head = tube.nodes[0];
          head.vx = (head.vx + (headTargetX - head.x) * tube.stiffness) * tube.damping;
          head.vy = (head.vy + (headTargetY - head.y) * tube.stiffness) * tube.damping;
          head.x += head.vx;
          head.y += head.vy;

          for (let j = 1; j < tube.nodes.length; j++) {
            const prev = tube.nodes[j - 1];
            const curr = tube.nodes[j];
            curr.x += (prev.x - curr.x) * 0.34;
            curr.y += (prev.y - curr.y) * 0.34;
          }

          // Subtle outer glow pass
          ctx.beginPath();
          ctx.moveTo(tube.nodes[0].x, tube.nodes[0].y);
          for (let j = 1; j < tube.nodes.length - 1; j++) {
            const xc = (tube.nodes[j].x + tube.nodes[j + 1].x) * 0.5;
            const yc = (tube.nodes[j].y + tube.nodes[j + 1].y) * 0.5;
            ctx.quadraticCurveTo(tube.nodes[j].x, tube.nodes[j].y, xc, yc);
          }
          ctx.strokeStyle = tube.color;
          ctx.globalAlpha = 0.14;
          ctx.lineWidth = tube.thickness * 3.4;
          ctx.stroke();

          // Clean inner core pass
          ctx.globalAlpha = 0.72;
          ctx.lineWidth = tube.thickness;
          ctx.stroke();
        }

        ctx.restore();
      }

      destroy() {
        if (this.rafId) {
          cancelAnimationFrame(this.rafId);
          this.rafId = null;
        }
        window.removeEventListener("resize", this.onResize);
        if (this.container) {
          this.container.removeEventListener("pointermove", this.onPointerMove);
          this.container.removeEventListener("pointerleave", this.onPointerLeave);
          this.container.removeEventListener("click", this.onHeroClick);
        }
      }
    }

    /* ==========================================================================
       4. SCROLL-BASED JOURNEY SVG CONTROLLER (DEVELOPER MODE)
       ========================================================================== */
    class DeveloperJourneyController {
      constructor() {
        this.shell = document.querySelector(".dev-journey-shell");
        this.svg = document.getElementById("journey-svg");
        this.bgPath = document.getElementById("journey-path-bg");
        this.fillPath = document.getElementById("journey-path-fill");
        this.nodes = Array.from(document.querySelectorAll(".journey-node"));
        this.sections = ["about", "skills", "projects", "experience", "education", "achievements"]
          .map((id) => document.getElementById(id))
          .filter(Boolean);

        this.pathLength = 0;
        this.ticking = false;
        this.onScroll = this.requestUpdate.bind(this);
        this.onResize = this.recalculateGeometry.bind(this);

        if (this.shell && this.svg && this.fillPath) {
          this.recalculateGeometry();
          window.addEventListener("scroll", this.onScroll, { passive: true });
          window.addEventListener("resize", this.onResize, { passive: true });
          this.updateProgress();
        }
      }

      recalculateGeometry() {
        if (!this.shell || !this.svg || !this.fillPath || !this.bgPath) return;
        const shellRect = this.shell.getBoundingClientRect();
        const totalHeight = Math.max(400, this.shell.offsetHeight - 100);
        const cx = 28;

        this.svg.setAttribute("viewBox", `0 0 56 ${totalHeight}`);
        const d = `M ${cx} 0 Q ${cx + 12} ${totalHeight * 0.25}, ${cx} ${totalHeight * 0.5} T ${cx} ${totalHeight}`;
        this.bgPath.setAttribute("d", d);
        this.fillPath.setAttribute("d", d);

        this.pathLength = this.fillPath.getTotalLength();
        this.fillPath.style.strokeDasharray = `${this.pathLength}`;
        this.fillPath.style.strokeDashoffset = `${this.pathLength}`;

        // Align milestone nodes vertically with each section header
        this.sections.forEach((sec, idx) => {
          const node = this.nodes[idx];
          if (!node) return;
          const secRect = sec.getBoundingClientRect();
          const relY = Math.max(24, Math.min(totalHeight - 24, secRect.top - shellRect.top + 28));
          node.setAttribute("cy", relY.toFixed(1));
        });

        this.updateProgress();
      }

      requestUpdate() {
        if (!this.ticking) {
          this.ticking = true;
          requestAnimationFrame(() => {
            this.updateProgress();
            this.ticking = false;
          });
        }
      }

      updateProgress() {
        if (!this.shell || !this.fillPath || !this.pathLength) return;
        const rect = this.shell.getBoundingClientRect();
        const triggerPoint = window.innerHeight * 0.52;
        const scrolled = triggerPoint - rect.top;
        const total = Math.max(1, rect.height - window.innerHeight * 0.25);
        const progress = Math.max(0, Math.min(1, scrolled / total));

        const offset = this.pathLength * (1 - progress);
        this.fillPath.style.strokeDashoffset = `${offset.toFixed(2)}`;

        this.sections.forEach((sec, idx) => {
          const node = this.nodes[idx];
          if (!node) return;
          const secTop = sec.getBoundingClientRect().top;
          node.classList.toggle("active", secTop <= triggerPoint + 40);
        });
      }

      destroy() {
        window.removeEventListener("scroll", this.onScroll);
        window.removeEventListener("resize", this.onResize);
      }
    }

       5. STACKING CARDS DECK CONTROLLER (CREATIVE MODE #WORK)
       ========================================================================== */
    class CreativeStackingDeck {
      constructor() {
        this.deck = document.getElementById("stack-deck");
        this.slots = Array.from(document.querySelectorAll(".stack-card-slot"));
        this.cards = this.slots.map((slot) => slot.querySelector(".stack-card"));
        this.dims = this.slots.map((slot) => slot.querySelector(".stack-card-dim"));
        this.counter = document.getElementById("stack-counter");
        this.barFill = document.getElementById("stack-bar-fill");
        this.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        this.ticking = false;

        this.onScroll = this.requestUpdate.bind(this);
        this.onResize = this.requestUpdate.bind(this);

        if (this.deck && this.slots.length) {
          window.addEventListener("scroll", this.onScroll, { passive: true });
          window.addEventListener("resize", this.onResize, { passive: true });
          this.update();
        }
      }

      requestUpdate() {
        if (!this.ticking) {
          this.ticking = true;
          requestAnimationFrame(() => {
            this.update();
            this.ticking = false;
          });
        }
      }

      update() {
        if (!this.slots.length) return;
        const total = this.slots.length;
        let activeIdx = 0;

        for (let i = 0; i < total; i++) {
          const slot = this.slots[i];
          const card = this.cards[i];
          const dim = this.dims[i];
          const stickyTop = parseFloat(getComputedStyle(slot).top) || 88;
          const slotRect = slot.getBoundingClientRect();

          if (slotRect.top <= stickyTop + 28) {
            activeIdx = i;
          }

          if (this.reducedMotion || !card) continue;

          if (i < total - 1) {
            const nextSlot = this.slots[i + 1];
            const nextStickyTop = parseFloat(getComputedStyle(nextSlot).top) || stickyTop + 18;
            const nextRect = nextSlot.getBoundingClientRect();
            const travelDistance = Math.max(120, slotRect.height * 0.85);
            const overlap = Math.max(0, Math.min(1, 1 - (nextRect.top - nextStickyTop) / travelDistance));

            const scale = 1 - overlap * 0.055;
            card.style.transform = `scale(${scale.toFixed(4)})`;
            if (dim) {
              dim.style.opacity = (overlap * 0.34).toFixed(3);
            }
          } else {
            card.style.transform = "scale(1)";
            if (dim) {
              dim.style.opacity = "0";
            }
          }
        }

        if (this.counter) {
          this.counter.textContent = `${String(activeIdx + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
        }
        if (this.barFill) {
          const pct = ((activeIdx + 1) / total) * 100;
          this.barFill.style.width = `${pct.toFixed(1)}%`;
        }
      }

      destroy() {
        window.removeEventListener("scroll", this.onScroll);
        window.removeEventListener("resize", this.onResize);
      }
    }

    /* ==========================================================================
       5B. CREATIVE MODE CUSTOM CINEMA RETICLE CURSOR
       ========================================================================== */
    class CreativeCinemaCursor {
      constructor() {
        this.dot = document.getElementById("cinema-cursor-dot");
        this.ring = document.getElementById("cinema-cursor-ring");
        this.label = document.getElementById("cinema-cursor-label");
        this.supported =
          window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
          !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        this.x = window.innerWidth * 0.5;
        this.y = window.innerHeight * 0.5;
        this.rx = this.x;
        this.ry = this.y;
        this.scale = 1;
        this.targetScale = 1;
        this.rafId = null;

        this.onMove = this.handleMove.bind(this);
        this.onOver = this.handleOver.bind(this);
        this.onDown = this.handleDown.bind(this);
        this.onUp = this.handleUp.bind(this);
        this.onLeave = this.handleLeave.bind(this);

        if (this.supported && this.dot && this.ring) {
          document.addEventListener("pointermove", this.onMove, { passive: true });
          document.addEventListener("pointerover", this.onOver, { passive: true });
          document.addEventListener("pointerdown", this.onDown, { passive: true });
          document.addEventListener("pointerup", this.onUp, { passive: true });
          document.addEventListener("mouseleave", this.onLeave, { passive: true });
          this.loop();
        }
      }

      handleMove(e) {
        this.x = e.clientX;
        this.y = e.clientY;
        this.dot.classList.add("visible");
        this.ring.classList.add("visible");
        this.dot.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
      }

      handleOver(e) {
        const mediaTarget = e.target.closest("[data-reel], #playreel, .stack-card");
        const interactiveTarget = e.target.closest("a, button, summary, [role='button']");

        this.ring.classList.remove("is-media", "is-hover");

        if (mediaTarget) {
          this.ring.classList.add("is-media");
          if (this.label) {
            this.label.textContent = mediaTarget.closest("#playreel") ? "WATCH" : "REEL";
          }
        } else if (interactiveTarget) {
          this.ring.classList.add("is-hover");
        }
      }

      handleDown() {
        this.targetScale = 0.84;
        this.ring.classList.add("is-down");
      }

      handleUp() {
        this.targetScale = 1;
        this.ring.classList.remove("is-down");
      }

      handleLeave() {
        this.dot.classList.remove("visible");
        this.ring.classList.remove("visible");
      }

      loop() {
        this.rx += (this.x - this.rx) * 0.18;
        this.ry += (this.y - this.ry) * 0.18;
        this.scale += (this.targetScale - this.scale) * 0.22;

        this.ring.style.transform = `translate3d(${this.rx.toFixed(2)}px, ${this.ry.toFixed(2)}px, 0) scale(${this.scale.toFixed(3)})`;
        this.rafId = requestAnimationFrame(() => this.loop());
      }

      destroy() {
        if (this.rafId) {
          cancelAnimationFrame(this.rafId);
          this.rafId = null;
        }
        document.removeEventListener("pointermove", this.onMove);
        document.removeEventListener("pointerover", this.onOver);
        document.removeEventListener("pointerdown", this.onDown);
        document.removeEventListener("pointerup", this.onUp);
        document.removeEventListener("mouseleave", this.onLeave);
        if (this.dot) this.dot.classList.remove("visible");
        if (this.ring) {
          this.ring.classList.remove("visible", "is-hover", "is-media", "is-down");
        }
      }
    }

    /* ==========================================================================
       5C. DEVELOPER MODE 3D CURSOR-REACTIVE CARD TILT CONTROLLER
       ========================================================================== */
    class DeveloperCardTiltController {
      constructor() {
        this.cards = Array.from(document.querySelectorAll(".dev-journey-shell .card"));
        this.supported =
          window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
          !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        this.listeners = [];

        if (this.supported && this.cards.length) {
          this.bindCards();
        }
      }

      bindCards() {
        const maxTilt = 7.5;

        this.cards.forEach((card) => {
          let rafId = null;

          const onEnter = () => {
            card.classList.add("is-tilting");
          };

          const onMove = (e) => {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
              const rect = card.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              const normX = (x / Math.max(1, rect.width)) * 2 - 1;
              const normY = (y / Math.max(1, rect.height)) * 2 - 1;

              const rotateY = normX * maxTilt;
              const rotateX = -normY * maxTilt;

              card.style.setProperty("--mx", `${x.toFixed(1)}px`);
              card.style.setProperty("--my", `${y.toFixed(1)}px`);
              card.style.setProperty("--rx", `${rotateX.toFixed(2)}deg`);
              card.style.setProperty("--ry", `${rotateY.toFixed(2)}deg`);
            });
          };

          const onLeave = () => {
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
            card.classList.remove("is-tilting");
            card.style.setProperty("--rx", "0deg");
            card.style.setProperty("--ry", "0deg");
          };

          card.addEventListener("pointerenter", onEnter, { passive: true });
          card.addEventListener("pointermove", onMove, { passive: true });
          card.addEventListener("pointerleave", onLeave, { passive: true });

          this.listeners.push({ card, onEnter, onMove, onLeave });
        });
      }

      destroy() {
        this.listeners.forEach(({ card, onEnter, onMove, onLeave }) => {
          card.removeEventListener("pointerenter", onEnter);
          card.removeEventListener("pointermove", onMove);
          card.removeEventListener("pointerleave", onLeave);
          card.classList.remove("is-tilting");
          card.style.removeProperty("--rx");
          card.style.removeProperty("--ry");
          card.style.removeProperty("--mx");
          card.style.removeProperty("--my");
        });
        this.listeners = [];
      }
    }

    /* ==========================================================================

    class CreativeHeroAuraController {
      constructor(canvas, container) {
        this.canvas = canvas;
        this.container = container;

        this.width = 0;

        this.pointer = { x: 0.62, y: 0.45, tx: 0.62, ty: 0.45, active: false };

      }

      initOrbs() {
        const count = window.innerWidth < 768 ? 2 : 3;
        const colors = ["#b8793a", "#8f4f22", "#d49b54"];
        this.orbs = Array.from({ length: count }, (_, idx) => ({
          angle: (idx / count) * Math.PI * 2,
          radius: 10 + idx * 5,
          size: 2 + idx * 0.8,
          speed: 0.28 + idx * 0.08,
          lag: 0.1 + idx * 0.025,
          color: colors[idx % colors.length],
          x: 0,
          y: 0,
          initialized: false
        }));
      }

      resize() {
        if (!this.canvas || !this.container) return;
        const rect = this.container.getBoundingClientRect();
        this.width = Math.max(1, rect.width);
        this.height = Math.max(1, rect.height);
        this.canvas.width = Math.floor(this.width * this.dpr);
        this.canvas.height = Math.floor(this.height * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      bindEvents() {
        window.addEventListener("resize", this.onResize, { passive: true });
        this.container.addEventListener("pointermove", this.onPointerMove, { passive: true });
        this.container.addEventListener("pointerleave", this.onPointerLeave, { passive: true });
      }

      handlePointerMove(e) {
        const rect = this.container.getBoundingClientRect();
        this.pointer.tx = (e.clientX - rect.left) / Math.max(1, rect.width);
        this.pointer.ty = (e.clientY - rect.top) / Math.max(1, rect.height);
        this.pointer.active = true;
      }

      handlePointerLeave() {
        this.pointer.active = false;
      }

      loop() {
        this.time += 0.016;
        this.renderFrame(this.time);
        this.rafId = requestAnimationFrame(() => this.loop());
      }

      renderFrame(t) {
        const ctx = this.ctx;
        if (!ctx) return;

        ctx.clearRect(0, 0, this.width, this.height);

        if (!this.pointer.active) {
          this.pointer.tx = 0.64 + Math.cos(t * 0.45) * 0.16;
          this.pointer.ty = 0.46 + Math.sin(t * 0.6) * 0.14;
        }

        this.pointer.x += (this.pointer.tx - this.pointer.x) * 0.08;
        this.pointer.y += (this.pointer.ty - this.pointer.y) * 0.08;

        const cx = this.pointer.x * this.width;
        const cy = this.pointer.y * this.height;

        // Clean, compact ambient spotlight following cursor
        const spot = ctx.createRadialGradient(cx, cy, 2, cx, cy, 52);
        spot.addColorStop(0, "rgba(184, 121, 58, 0.09)");
        spot.addColorStop(0.65, "rgba(143, 79, 34, 0.02)");
        spot.addColorStop(1, "rgba(143, 79, 34, 0)");
        ctx.fillStyle = spot;
        ctx.fillRect(0, 0, this.width, this.height);

        // Minimalist micro-bokeh dots
        ctx.save();
        for (let i = 0; i < this.orbs.length; i++) {
          const orb = this.orbs[i];
          const a = orb.angle + t * orb.speed;
          const targetX = cx + Math.cos(a) * orb.radius;
          const targetY = cy + Math.sin(a * 1.15) * (orb.radius * 0.72);

          if (!orb.initialized) {
            orb.x = targetX;
            orb.y = targetY;
            orb.initialized = true;
          } else {
            orb.x += (targetX - orb.x) * orb.lag;
            orb.y += (targetY - orb.y) * orb.lag;
          }

          ctx.fillStyle = "rgba(184, 121, 58, 0.18)";
          ctx.beginPath();
          ctx.arc(orb.x, orb.y, orb.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      destroy() {
        if (this.rafId) {
          cancelAnimationFrame(this.rafId);
          this.rafId = null;
        }
        window.removeEventListener("resize", this.onResize);
        if (this.container) {
          this.container.removeEventListener("pointermove", this.onPointerMove);
          this.container.removeEventListener("pointerleave", this.onPointerLeave);
        }
      }
    }

    function setupScrollReveals() {
      const targets = document.querySelectorAll(
        "h2, .card:not(.stack-card), .chips li, .stats > div, .hero-copy h1, .creative-hero-copy h1, .code, .show, .tl, .hero-portrait-wrap, .creative-avatar-wrap"
      );

      if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        targets.forEach((el) => el.classList.add("in"));
        return;
      }

      revealObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("in");
              revealObserver.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.1 }
      );

      targets.forEach((el, i) => {
        el.classList.add("rv");
        el.style.setProperty("--d", `${(i % 4) * 55}ms`);
        revealObserver.observe(el);
      });
    }

    function pickInitialMode() {
      let m = null;
      try {
        m = new URLSearchParams(location.search).get("mode");
      } catch (e) {}
      if (!["creative", "developer"].includes(m)) {
        const h = location.hash.slice(1);
        m = ["creative", "developer"].includes(h) ? h : null;
      }
      if (!m) {
        try {
          m = localStorage.getItem("ks-mode");
        } catch (e) {}
      }
      return m === "creative" ? "creative" : "developer";
    }

    function renderMode(m, animate) {
      const executeRender = () => {
        cleanupActiveControllers();

        currentMode = m;
        document.documentElement.dataset.mode = m;
        document.title = TITLES[m];

        $("#main").innerHTML = VIEWS[m]();
        $("#nav").innerHTML = NAV[m]
          .map((n) => `<a href="#${n[1]}" data-go="${n[1]}">${esc(n[0])}</a>`)
          .join("");

        document.querySelectorAll(".sw button").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.m === m));
        });

        $("#foot").innerHTML = `
          <div>
            <b style="color: var(--tx);">Kanish Singh</b>${m === "creative" ? " · Music Mania" : ""}<br />
            ${esc(C.loc)} · © ${new Date().getFullYear()}
          </div>
          <div>
            <a href="mailto:${esc(C.email)}">${esc(C.email)}</a> ·
            <a href="${esc(waLink)}" target="_blank" rel="noopener">${esc(C.phoneShow)}</a><br />
            <a href="${esc(C.ig)}" target="_blank" rel="noopener">Instagram @music_mania440</a>
            ${C.github ? ` · <a href="${esc(C.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}
            ${C.linkedin ? ` · <a href="${esc(C.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
          </div>
        `;

        $("#main").classList.remove("out");
        window.scrollTo(0, 0);

        // Initialize mode-exclusive interactive engines
        if (m === "developer") {
          const canvas = document.getElementById("tubes-canvas");
          const heroEl = document.getElementById("home");
          const badgeEl = document.getElementById("tubes-cycle-btn");
          tubesInstance = new HeroTubesController(canvas, heroEl, badgeEl);
          journeyInstance = new DeveloperJourneyController();
          devCardTiltInstance = new DeveloperCardTiltController();
        } else if (m === "creative") {
          const creativeCanvas = document.getElementById("creative-hero-canvas");
          const creativeHeroEl = document.getElementById("home");
          creativeHeroAuraInstance = new CreativeHeroAuraController(creativeCanvas, creativeHeroEl);
          stackDeckInstance = new CreativeStackingDeck();
          cinemaCursorInstance = new CreativeCinemaCursor();
        }

        setupScrollReveals();
      };

      if (animate && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        $("#main").classList.add("out");
        setTimeout(executeRender, 220);
      } else {
        executeRender();
      }
    }

    function setMode(m) {
      if (m === currentMode) return;
      try {
        localStorage.setItem("ks-mode", m);
      } catch (e) {}
      try {
        history.replaceState(null, "", `#${m}`);
      } catch (e) {
        location.hash = m;
      }
      renderMode(m, true);
    }

    // Mode Toggle Listeners
    document.querySelectorAll(".sw button").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.m));
    });

    // Mobile Menu Toggle
    $("#menu").addEventListener("click", (e) => {
      const open = $("#nav").classList.toggle("open");
      e.currentTarget.setAttribute("aria-expanded", String(open));
    });

    // Brand Scroll-to-Top
    $("#brand").addEventListener("click", (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Delegated Interactions (Smooth Section Scroll, Showreel Poster, Reel Modal, Mobile Gallery Nav)
    document.addEventListener("click", (e) => {
      const goLink = e.target.closest("[data-go]");
      if (goLink) {
        e.preventDefault();
        $("#nav").classList.remove("open");
        $("#menu").setAttribute("aria-expanded", "false");
        const targetEl = document.getElementById(goLink.dataset.go);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: "smooth" });
        }
        return;
      }

      const playPoster = e.target.closest("#playreel");
      if (playPoster) {
        playPoster.remove();
        return;
      }

      const reelBtn = e.target.closest("[data-reel]");
      if (reelBtn) {
        const idx = Number(reelBtn.dataset.reel);
        const reel = REELS[idx];
        if (!reel) return;
        const match = reel.url.match(/reel\/([^/?]+)/);
        const id = match ? match[1] : "";

        $("#dbody").innerHTML = `
          <h3 style="margin-bottom: 10px;">${esc(reel.title)}</h3>
          <iframe loading="lazy" title="${esc(reel.title)}" src="https://www.instagram.com/reel/${esc(id)}/embed" allowfullscreen></iframe>
          <p class="note" style="margin-top: 10px;">If the preview stays blank, your browser blocked third-party embeds. Use the button below to watch directly on Instagram.</p>
        `;
        $("#dlink").href = reel.url;
        $("#dlg").showModal();
        return;
      }

      if (e.target.id === "tubes-cycle-btn" || e.target.closest("#tubes-cycle-btn")) {
        if (tubesInstance) {
          tubesInstance.handleHeroClick({ target: document.getElementById("home") });
        }
        return;
      }

      if (e.target.id === "dclose") {
        $("#dlg").close();
        $("#dbody").innerHTML = "";
      }
    });

    $("#dlg").addEventListener("close", () => {
      $("#dbody").innerHTML = "";
    });

    window.addEventListener("hashchange", () => {
      const h = location.hash.slice(1);
      if (["creative", "developer"].includes(h) && h !== currentMode) {
        setMode(h);
      }
    });

    // Boot Application
    window.addEventListener("DOMContentLoaded", () => {
      renderMode(pickInitialMode(), false);
    });
  </script>
</body>
</html>
